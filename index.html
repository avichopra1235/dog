<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071426">
  <meta name="description" content="Definition of Gurjar — Hitman, Vidhwaan & Icyy. Stream now.">
  <title>Definition of Gurjar — Hitman</title>
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#061223;--bg2:#091a30;--line:rgba(175,201,232,.12);--text:#f4f7fb;--muted:#91a1b8;--accent:#d8e9ff}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    .bg{position:fixed;inset:0;z-index:-4;background:#061223 url("assets/visual.gif") center/cover no-repeat;filter:saturate(.75);opacity:.33;transform:scale(1.03)}
    .wash{position:fixed;inset:0;z-index:-3;background:
      radial-gradient(circle at 50% 35%,rgba(35,88,145,.26),transparent 35%),
      linear-gradient(180deg,rgba(3,12,25,.42),rgba(3,12,25,.94) 82%,#061223)}
    .grain{position:fixed;inset:-50%;z-index:-2;opacity:.055;pointer-events:none;background-image:url("assets/background.jpg");background-size:420px;mix-blend-mode:screen;filter:contrast(140%) grayscale(1);animation:grain 1.7s steps(2) infinite}
    @keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(2%,-1%)}50%{transform:translate(-1%,2%)}75%{transform:translate(1%,1%)}100%{transform:translate(0,0)}}
    .wrap{width:min(1120px,calc(100% - 40px));margin:auto}
    header{padding:26px 0;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px}
    .brand img{width:48px;height:48px;object-fit:contain}
    .brand span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#b7c6d9}
    .pill{border:1px solid var(--line);background:rgba(8,23,43,.6);backdrop-filter:blur(14px);padding:9px 13px;border-radius:999px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#aebdd0}
    main{min-height:calc(100vh - 110px);display:grid;place-items:center;padding:28px 0 70px}
    .hero{width:min(980px,100%);display:grid;grid-template-columns:minmax(280px,460px) 1fr;gap:clamp(28px,6vw,82px);align-items:center}
    .cover-wrap{position:relative;aspect-ratio:1;max-width:460px;margin:auto;width:100%}
    .cover-wrap:before{content:"";position:absolute;inset:-22px;border:1px solid rgba(190,216,245,.1);border-radius:28px;transform:rotate(-3deg)}
    .cover-wrap:after{content:"";position:absolute;inset:12% -8% -7% 18%;background:#204a78;filter:blur(55px);opacity:.28;z-index:-1;border-radius:50%}
    .cover{width:100%;height:100%;object-fit:cover;border-radius:18px;display:block;box-shadow:0 35px 100px rgba(0,0,0,.55)}
    .eyebrow{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:#91a7c1;margin-bottom:18px}
    h1{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(64px,10vw,124px);line-height:.82;letter-spacing:.015em;margin:0 0 14px;text-transform:uppercase}
    .artist{font-size:18px;color:#cbd6e4;margin-bottom:30px}
    .artist strong{color:#fff}
    .meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
    .meta span{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:#8ea0b8;font-size:11px;text-transform:uppercase;letter-spacing:.1em;background:rgba(8,22,41,.45)}
    .player{border:1px solid rgba(179,206,237,.13);border-radius:18px;padding:7px;background:rgba(4,15,29,.68);backdrop-filter:blur(16px);box-shadow:0 18px 60px rgba(0,0,0,.28)}
    iframe{display:block;width:100%;height:152px;border:0;border-radius:12px}
    .links{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:45px;padding:0 17px;border-radius:999px;border:1px solid rgba(190,215,243,.16);background:rgba(255,255,255,.04);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;transition:.2s ease}
    .btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.08);border-color:rgba(190,215,243,.3)}
    .btn.primary{background:#f1f5fa;color:#061223;border-color:#f1f5fa}
    .visual-card{margin-top:28px;position:relative;height:145px;overflow:hidden;border:1px solid var(--line);border-radius:18px}
    .visual-card img{width:100%;height:100%;object-fit:cover;opacity:.35;filter:saturate(.5)}
    .visual-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:7px}
    .bar{width:4px;border-radius:99px;background:#dbe8f7;animation:pulse .85s ease-in-out infinite}
    .bar:nth-child(1){height:25px;animation-delay:-.2s}.bar:nth-child(2){height:45px;animation-delay:-.35s}.bar:nth-child(3){height:75px;animation-delay:-.1s}.bar:nth-child(4){height:55px;animation-delay:-.45s}.bar:nth-child(5){height:30px;animation-delay:-.25s}.bar:nth-child(6){height:62px;animation-delay:-.05s}.bar:nth-child(7){height:40px;animation-delay:-.4s}
    @keyframes pulse{0%,100%{transform:scaleY(.45);opacity:.45}50%{transform:scaleY(1);opacity:1}}
    footer{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#61738c;font-size:10px;letter-spacing:.15em;text-transform:uppercase;pointer-events:none}
    footer b{color:#8da0b9}
    @media(max-width:780px){
      .wrap{width:min(100% - 28px,520px)}
      header{padding:18px 0}
      .brand img{width:40px;height:40px}
      .pill{display:none}
      main{display:block;padding:35px 0 80px}
      .hero{display:flex;flex-direction:column;gap:34px;align-items:stretch}
      .cover-wrap{width:min(82vw,390px);margin:0 auto}
      .hero-copy{text-align:center}
      .eyebrow{font-size:10px;margin-bottom:12px}
      h1{font-size:clamp(60px,18vw,94px)}
      .artist{font-size:15px;margin-bottom:22px}
      .meta{justify-content:center;margin-bottom:20px}
      .player iframe{height:152px}
      .links{justify-content:center}
      .visual-card{margin-top:22px;height:110px}
      footer{position:relative;bottom:auto;margin:18px 0 24px}
    }
    @media(prefers-reduced-motion:reduce){
      .grain,.bar{animation:none}
      html{scroll-behavior:auto}
    }
  </style>
</head>
<body>
  <div class="bg"></div><div class="wash"></div><div class="grain"></div>
  <header class="wrap">
    <a class="brand" href="#" aria-label="Rebel Talents">
      <img src="assets/rebel-talents-logo.png" alt="Rebel Talents">
      <span>Rebel Talents</span>
    </a>
    <div class="pill">New Release · 2026</div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="cover-wrap">
        <img class="cover" src="assets/cover.jpg" alt="Definition of Gurjar cover art">
      </div>
      <div class="hero-copy">
        <div class="eyebrow">Hitman · Vidhwaan · Icyy</div>
        <h1>Definition<br>of Gurjar</h1>
        <div class="artist">A new release by <strong>Hitman</strong> featuring Vidhwaan &amp; Icyy</div>
        <div class="meta">
          <span>Hip-Hop / Rap</span><span>2026</span><span>2:00</span>
        </div>
        <div class="player" id="listen">
          <iframe title="Spotify player" src="https://open.spotify.com/embed/track/4A3welGTi3HObgtwDvoEyH?utm_source=generator&theme=0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
        <div class="links">
          <a class="btn primary" href="https://open.spotify.com/album/4A3welGTi3HObgtwDvoEyH" target="_blank" rel="noopener">Open Spotify</a>
          <a class="btn" href="https://music.apple.com/in/album/definition-of-gurjar/6784807345?i=6784807346" target="_blank" rel="noopener">Apple Music</a>
        </div>
        <div class="visual-card" aria-label="Animated track visualizer">
          <img src="assets/background.jpg" alt="" aria-hidden="true">
          <div class="visual-overlay">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer>© 2026 <b>Rebel Talents</b> · All rights reserved</footer>
</body>
</html>
